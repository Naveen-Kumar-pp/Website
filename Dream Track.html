<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Habit Hero</title>

    <link rel="icon" href="./habit hero logo.jpeg">
    <link rel="stylesheet" href="Habit.css">
</head>

<body>

    <header>
        <img src="./habit hero logo.jpeg" alt="Habit Hero Logo" class="logo">

        <h1>Welcome to Habit Hero</h1>

        <p>Build Better Habits. Achieve Your Dreams.</p>
    </header>

    <main>

        <section class="login-card">

            <h2>Login</h2>

            <form>

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

                <button type="submit">Login</button>

                <a href="#">Forgot Password?</a>

                <a href="./Create Account.html">Create Account</a>

            </form>

        </section>

    </main>

</body>

</html>
