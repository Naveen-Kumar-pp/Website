<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Hero</title>
    <link rel="stylesheet" href="./forget.css ">
    <link rel="icon" href="./habit hero logo.jpeg">
</head>
<body>
    <header>
         <img src="./habit hero logo.jpeg" alt="Habit Hero Logo" class="logo">

        <h1>Forget Password</h1>
        <p>Don't worry! Enter your registered email address. </p>
        <p> We'll send you a password reset link.</p>
    </header>
    <section id="container">
        <form action="">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter Your Password ">
            <button type="submit">Send Reset Link</button>
            <p class="login-link">Remember Your Password?
                <a href="./Dream Track.html"  > Login </a>
            </p>
            
            <p class="login-link">Don't have an account?
                <a href="./Create Account.html">Create Account</a>
            </p>
            
        </form>
    </section>
</body>
</html>
