<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Habit Hero</title>

    <link rel="icon" href="./habit hero logo.jpeg">
    <link rel="stylesheet" href="create.css">
</head>

<body>

    <header>
        <img src="./habit hero logo.jpeg" alt="Habit Hero Logo" class="logo">

        <h1>Create Account</h1>

        <p>Start Your Habit Journey Today!</p>
    </header>

    <main>

        <section class="signup-card">

            <form action="#">

                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" placeholder="Enter your first name" required>

                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" placeholder="Enter your last name" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <label for="cpassword">Confirm Password</label>
                <input type="password" id="cpassword" name="cpassword" placeholder="Confirm your password" required>

                <div class="terms">
                    <input type="checkbox" id="agree" required>
                    <label for="agree">
                        I agree to the Terms & Conditions
                    </label>
                </div>

                <button type="submit">Create Account</button>

                <p class="login-link">
                    Already have an account?
                    <a href="./Dream Track.html">Login</a>
                </p>

            </form>

        </section>

    </main>

</body>
</html>
